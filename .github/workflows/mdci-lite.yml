name: MDCI lite offline checks
on:
  push:
    paths:
      - 'mdci/**'
      - 'review-lite.txt'
      - '.github/workflows/mdci-lite.yml'
  pull_request:
    paths:
      - 'mdci/**'
      - 'review-lite.txt'
      - '.github/workflows/mdci-lite.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test without external services
        run: python -m unittest discover -s mdci -p 'test_*.py' -v
